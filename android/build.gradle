// Legacy buildscript-classpath form on purpose: it resolves the real AGP
// artifact directly. Repos point at Aliyun mirrors because dl.google.com is
// blocked in this environment (the local Gradle cache was populated via Aliyun).
buildscript {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
