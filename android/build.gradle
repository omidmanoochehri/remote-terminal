// Legacy buildscript-classpath form on purpose: it resolves the real AGP
// artifact directly. Google/Maven Central come first; the Aliyun mirrors stay
// as fallbacks for build environments where dl.google.com is blocked.
buildscript {
    repositories {
        google()
        mavenCentral()
        // Fallback mirrors for environments where dl.google.com / Maven Central are blocked.
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
